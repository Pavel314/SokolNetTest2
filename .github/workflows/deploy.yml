name: Webversion and Deploy

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Sokol.NET Framework
      uses: actions/checkout@v4
      with:
        repository: elix22/Sokol.NET
        path: framework

    - name: Checkout your project code
      uses: actions/checkout@v4
      with:
        path: project

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Configure SokolNetHome Path
      run: |
        mkdir -p ~/.sokolnet_config
        echo "${{ github.workspace }}/framework" > ~/.sokolnet_config/sokolnet_home

    - name: Purge solution and non-web projects
      run: |
        cd project
        echo "Purging non-web files..."
        rm -f *.sln
        find . -maxdepth 1 -type f -name "*.csproj" ! -name "*Web.csproj" -delete

    - name: Install WASM Tools workload
      run: |
        cd project
        dotnet workload restore

    - name: Restore dependencies
      run: |
        cd project
        dotnet restore

    - name: Build webversion
      run: |
        cd project
        # Собираем проект стандартным для Sokol.NET путем
        dotnet publish -c Release -r browser-wasm
        
        # Создаем .nojekyll прямо в итоговой wwwroot проекта, откуда пойдет деплой!
        touch wwwroot/.nojekyll

    - name: Deploy to GitHub Pages
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        # Публикуем именно роднуюwwwroot, куда .NET скопировал AppBundle со всеми .js скриптами
        publish_dir: ./project/wwwroot
        enable_jekyll: false
        allow_empty_commit: false
        force_orphan: true
